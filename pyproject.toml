[project]
name = "syncons"
version = "0.1.0"
description = "SSR protocol simulator and prototype data plane."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cocotb-test>=0.2.6",
    "loguru>=0.7.3",
    "scapy>=2.7.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "cocotb>=1.8,<2",
    "cocotbext-axi>=0.1.28",
    "cocotbext-eth>=0.1.22",
    "cocotbext-pcie>=0.2.16",
]
