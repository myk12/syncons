syntax = "proto3";

package ssr.control.v1;

//Uniquely identifies one cluster execution
message SessionId {
    fixed64 high = 1;
    fixed64 low = 2;
}

// Exactly size bytes in network display order.
message MacAddress {
    bytes value = 1;
}

// Cluster-wide configuration.
message ClusterConfig {
    repeated MacAddress replica_macs = 1;
    uint32 ethernet_type = 2;
    uint32 round_length_ns = 3;
}

// Result of the clock/time synchronization procedure.
message SyncResult {
    bool synchronized = 1;

    sint64 estimated_offset_ns = 2;
    uint64 uncertainty_ns = 3;
}

// Dataplane starts at a shared future timestamp
message StartConfig {
    uint32 first_round_id = 1;
    uint64 first_round_timestamp_ns = 2;
    uint32 first_run_id = 3;
}

enum NodeState {
    NODE_STATE_UNSPECIFIED = 0;
    NODE_STATE_IDLE = 1;
    NODE_STATE_READY = 2;
    NODE_STATE_RUNNING = 3;
    NODE_STATE_STOPPED = 4;
    NODE_STATE_FAILED = 5;
}

enum DataplaneState {
    DATAPLANE_STATE_UNSPECIFIED = 0;
    DATAPLANE_STATE_CLOSED = 1;
    DATAPLANE_STATE_READY = 2;
    DATAPLANE_STATE_RESET = 3;
    DATAPLANE_STATE_CONFIGURED = 4;
    DATAPLANE_STATE_SYNCHRONIZED = 5;
    DATAPLANE_STATE_RUNNING = 6;
    DATAPLANE_STATE_STOPPED = 7;
}

message DataplaneStatus {
    DataplaneState state = 1;

    bool config_valid = 2;
    bool sync_valid = 3;
    bool running = 4;
}

// A snapshot of one NodeAgent and its local dataplane.
message NodeStatus {
    uint32 node_id = 1;
    NodeState state = 2;

    SessionId session_id = 3;

    DataplaneStatus dataplane_status = 4;
}

// Coordinator -> NodeAgent commands.
message PrepareRequest {
    uint32 target_node_id = 1;

    SessionId session_id = 2;
    ClusterConfig cluster_config = 3;
    SyncResult sync_result = 4;
}

message StartRequest {
    uint32 target_node_id = 1;

    SessionId session_id = 2;
    StartConfig start_config = 3;
}

message StopRequest {
    uint32 target_node_id = 1;

    SessionId session_id = 2;
}


// Reset is deliberately unconditional
message ResetRequest {
    uint32 target_node_id = 1;
}

message GetStatusRequest {
    uint32 target_node_id = 1;
}

message NodeReply {
    // Node id
    uint32 node_id = 1;
    NodeState state = 2;
    DataplaneStatus dataplane_status = 3;
    SessionId session_id = 4;
}

// NodeAgent -> current leader reports.
enum NodeEventKind {
    NODE_EVENT_UNSPECIFIED = 0;

    NODE_EVENT_STATE_CHANGED = 1;
    NODE_EVENT_DATAPLANE_HALTED = 2;
    NODE_EVENT_DATAPLANE_ERROR = 3;
}

// sequence number is monotonically increasing for each node
message NodeEventReport {
    uint32 node_id = 1;
    uint64 sequence_number = 2;

    SessionId session_id = 3;

    NodeEventKind event = 4;
    NodeState node_state = 5;
    DataplaneState dataplane_state = 6;

    string detail = 7;
}

message ReportNodeEventReply {
    uint64 ack_sequence_number = 1;
}

// Runs on every replica host.
service NodeAgentService {
    rpc Prepare(PrepareRequest) returns (NodeReply);
    rpc Start(StartRequest) returns (NodeReply);
    rpc Stop(StopRequest) returns (NodeReply);
    rpc Reset(ResetRequest) returns (NodeReply);
    rpc GetStatus(GetStatusRequest) returns (NodeReply);
    rpc ReportNodeEvent(NodeEventReport) returns (ReportNodeEventReply);
}

// Runs on the current leader
service CoordinatorService {
    rpc ReportNodeEvent(NodeEventReport) returns (ReportNodeEventReply);
}