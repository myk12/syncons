syntax = "proto3";

package ssr.control.v1;

//Uniquely identifies one cluster execution
message SessionId {
    fixed64 high = 1;
    fixed64 low = 2;
}

// Exactly size bytes in network display order.
message MacAddress {
    bytes value = 1;
}

// Cluster-wide configuration.
message ClusterConfig {
    repeated MacAddress replica_macs = 1;
    uint32 ethernet_type = 2;
    uint32 round_length_ns = 3;
}

// Result of the clock/time synchronization procedure.
message SyncResult {
    bool synchronized = 1;
    sint64 estimated_offset_ns = 2;
    uint64 uncertainty_ns = 3;
    uint32 round_length_ns = 4;
}

message RunConfig {
    uint64 run_id = 1;
    uint64 start_time_ns = 2;
    uint32 replica_num = 3;
    uint32 round_length_ns = 4;
}

enum AgentState {
    AGENT_STATE_UNSPECIFIED = 0;
    AGENT_STATE_IDLE = 1;
    AGENT_STATE_CONFIGURED = 2;
    AGENT_STATE_RUNNING = 3;
    AGENT_STATE_STOPPED = 4;
}

enum DataplaneState {
    DATAPLANE_STATE_UNSPECIFIED = 0;
    DATAPLANE_STATE_CLOSED = 1;
    DATAPLANE_STATE_OPEN = 2;
    DATAPLANE_STATE_CONFIGURED = 3;
    DATAPLANE_STATE_RUNNING = 4;
    DATAPLANE_STATE_HALTED = 5;
}

message DataplaneStatus {
    DataplaneState state = 1;

    bool config_valid = 2;
    bool running = 4;
}

// A snapshot of one NodeAgent and its local dataplane.
message NodeStatus {
    uint32 node_id = 1;
    AgentState state = 2;

    SessionId session_id = 3;

    DataplaneStatus dataplane_status = 4;
}

// Coordinator -> NodeAgent commands.
message PrepareRequest {
    uint32 target_node_id = 1;

    SessionId session_id = 2;
    RunConfig run_config = 3;
}

message StartRequest {
    uint32 target_node_id = 1;
    SessionId session_id = 2;
}

message StopRequest {
    uint32 target_node_id = 1;
    SessionId session_id = 2;
}

message GetStatusRequest {
    uint32 target_node_id = 1;
}

message AgentReply {
    // Node id
    uint32 node_id = 1;
    AgentState state = 2;
    DataplaneStatus dataplane_status = 3;
    SessionId session_id = 4;
}

// Runs on every replica host.
service AgentService {
    rpc Prepare(PrepareRequest) returns (AgentReply);
    rpc Start(StartRequest) returns (AgentReply);
    rpc Stop(StopRequest) returns (AgentReply);
    rpc GetStatus(GetStatusRequest) returns (AgentReply);
}
